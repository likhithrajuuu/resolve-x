# Kong Gateway OSS, DB-less. This file IS the gateway configuration; change it
# in git, not through the Admin API. Validate with: make kong-check
_format_version: "3.0"
_transform: true

services:
  # Tenancy and access management (projects, environments, API keys).
  - name: tenancy
    url: http://tenancy:8080
    connect_timeout: 2000
    read_timeout: 10000
    write_timeout: 10000
    retries: 1
    routes:
      - name: tenancy-projects
        paths: ["/api/v1/projects", "/api/v1/dashboards"]
        strip_path: false
      - name: tenancy-auth
        paths: ["/api/v1/auth"]
        strip_path: false
        plugins:
          # Credential endpoints get a much tighter limit (brute-force protection).
          - name: rate-limiting
            config: { minute: 20, policy: local, fault_tolerant: true }

  - name: query
    url: http://query:8081
    read_timeout: 30000
    routes:
      - name: query-telemetry
        paths: ["/api/v1/services", "/api/v1/dependencies", "/api/v1/traces", "/api/v1/logs", "/api/v1/metrics"]
        strip_path: false

  - name: incident
    url: http://incident:8082
    routes:
      - name: incident-api
        paths: ["/api/v1/incidents", "/api/v1/analyses", "/api/v1/deployments", "/api/v1/webhooks", "/api/v1/alert-rules", "/api/v1/slos"]
        strip_path: false

# OTLP is intentionally NOT routed through Kong: ingestion has very different
# load characteristics and is exposed directly (api-gateway.md, Does Not Own).

plugins:
  - name: correlation-id
    config: { header_name: X-Request-Id, generator: uuid, echo_downstream: true }
  - name: request-size-limiting
    config: { allowed_payload_size: 1, size_unit: megabytes }   # API calls only
  - name: rate-limiting
    config:
      second: 50            # per client IP; per-tenant limits arrive with consumer auth
      policy: local         # use redis policy when running >1 Kong replica
      fault_tolerant: true
  - name: cors
    config:
      origins: ["http://localhost:3000", "http://localhost:3100"]
      methods: [GET, POST, PUT, PATCH, DELETE, OPTIONS]
      headers: [Authorization, Content-Type, X-Request-Id]
      exposed_headers: [X-Request-Id]
      max_age: 3600
  - name: prometheus
