# Local development stack. `make up` from backend/.
name: resolvex

x-go: &go
  build: { context: .., args: {} }
  restart: unless-stopped
  depends_on:
    kafka: { condition: service_healthy }
    postgres: { condition: service_healthy }
    redis: { condition: service_healthy }

services:
  kafka:
    image: apache/kafka:3.9.0   # KRaft, single node for dev
    ports: ["9092:9092"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:19092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:19092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_NUM_PARTITIONS: 12
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 5s
      retries: 20

  postgres:
    image: postgres:17
    ports: ["5432:5432"]
    environment: { POSTGRES_USER: resolvex, POSTGRES_PASSWORD: resolvex, POSTGRES_DB: resolvex }
    volumes: ["../migrations:/docker-entrypoint-initdb.d:ro"]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U resolvex"], interval: 3s, retries: 20 }

  redis:
    image: redis:7
    ports: ["6379:6379"]
    healthcheck: { test: ["CMD", "redis-cli", "ping"], interval: 3s, retries: 20 }

  clickhouse:
    image: clickhouse/clickhouse-server:25.3
    ports: ["8123:8123", "9000:9000"]
    ulimits: { nofile: { soft: 262144, hard: 262144 } }
    healthcheck: { test: ["CMD-SHELL", "clickhouse-client -q 'SELECT 1'"], interval: 3s, retries: 30 }

  ingestion:
    <<: *go
    build: { context: .., args: { SERVICE: ingestion } }
    ports: ["4317:4317", "4318:4318", "9101:9100"]
    environment: &env
      KAFKA_BROKERS: kafka:19092
      POSTGRES_URL: postgres://resolvex:resolvex@postgres:5432/resolvex
      REDIS_ADDR: redis:6379

  processor:
    <<: *go
    build: { context: .., args: { SERVICE: processor } }
    ports: ["9102:9100"]
    depends_on:
      kafka: { condition: service_healthy }
      clickhouse: { condition: service_healthy }
    environment:
      KAFKA_BROKERS: kafka:19092
      CLICKHOUSE_ADDR: clickhouse:9000

  gateway:
    <<: *go
    build: { context: .., args: { SERVICE: gateway } }
    ports: ["8080:8080", "9103:9100"]
    environment:
      <<: *env
      GATEWAY_DEV_TOKEN: dev-token
