# Local development stack. `make up` from backend/.
name: resolvex

x-go: &go
  build: { context: .., args: {} }
  restart: unless-stopped
  depends_on:
    kafka: { condition: service_healthy }
    postgres: { condition: service_healthy }
    redis: { condition: service_healthy }

services:
  kafka:
    image: apache/kafka:3.9.0   # KRaft, single node for dev
    ports: ["9092:9092"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:19092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:19092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_NUM_PARTITIONS: 12
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 5s
      retries: 20

  postgres:
    image: postgres:17
    ports: ["5432:5432"]
    environment: { POSTGRES_USER: resolvex, POSTGRES_PASSWORD: resolvex, POSTGRES_DB: resolvex }
    volumes: ["../migrations:/docker-entrypoint-initdb.d:ro"]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U resolvex"], interval: 3s, retries: 20 }

  redis:
    image: redis:7
    ports: ["6379:6379"]
    healthcheck: { test: ["CMD", "redis-cli", "ping"], interval: 3s, retries: 20 }

  clickhouse:
    image: clickhouse/clickhouse-server:25.3
    ports: ["8123:8123", "9000:9000"]
    environment: { CLICKHOUSE_USER: resolvex, CLICKHOUSE_PASSWORD: resolvex, CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1" }
    volumes: ["./clickhouse/init.sql:/docker-entrypoint-initdb.d/init.sql:ro"]
    ulimits: { nofile: { soft: 262144, hard: 262144 } }
    healthcheck: { test: ["CMD-SHELL", "clickhouse-client --user resolvex --password resolvex -q 'SELECT 1'"], interval: 3s, retries: 30 }

  ingestion:
    <<: *go
    build: { context: .., args: { SERVICE: ingestion } }
    ports: ["4317:4317", "4318:4318", "9101:9100"]
    environment: &env
      JWT_SECRET: dev-only-secret-change-me-0123456789abcdef
      SECRETS_KEY: dev-only-secrets-key-change-me-0123456789
      KAFKA_BROKERS: kafka:19092
      POSTGRES_URL: postgres://resolvex:resolvex@postgres:5432/resolvex
      REDIS_ADDR: redis:6379

  processor:
    <<: *go
    build: { context: .., args: { SERVICE: processor } }
    ports: ["9102:9100"]
    depends_on:
      kafka: { condition: service_healthy }
      clickhouse: { condition: service_healthy }
    environment:
      KAFKA_BROKERS: kafka:19092
      CLICKHOUSE_ADDR: clickhouse:9000
      CLICKHOUSE_USER: resolvex
      CLICKHOUSE_PASSWORD: resolvex
      CLICKHOUSE_RO_USER: resolvex_ro        # the processor creates the read-only account
      CLICKHOUSE_RO_PASSWORD: resolvex_ro

  tenancy:
    <<: *go
    build: { context: .., args: { SERVICE: tenancy } }
    expose: ["8080"]            # reachable only through Kong
    ports: ["9103:9100"]
    environment:
      <<: *env
      DEV_SEED_USER: "dev@resolve-x.local:devpassword1"   # local development only

  query:
    <<: *go
    build: { context: .., args: { SERVICE: query } }
    expose: ["8081"]
    depends_on:
      clickhouse: { condition: service_healthy }
    environment:
      <<: *env
      CLICKHOUSE_ADDR: clickhouse:9000
      CLICKHOUSE_USER: resolvex_ro
      CLICKHOUSE_PASSWORD: resolvex_ro

  incident:
    <<: *go
    build: { context: .., args: { SERVICE: incident } }
    expose: ["8082"]
    depends_on:
      kafka: { condition: service_healthy }
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      clickhouse: { condition: service_healthy }
    environment:
      <<: *env
      CLICKHOUSE_ADDR: clickhouse:9000
      CLICKHOUSE_USER: resolvex_ro
      CLICKHOUSE_PASSWORD: resolvex_ro
      AI_ALLOW_PRIVATE_BASE_URLS: "true"   # local dev: lets webhooks target a local receiver
      PUBLIC_URL: http://localhost:3000

  analysis:
    <<: *go
    build: { context: .., args: { SERVICE: analysis } }
    depends_on:
      kafka: { condition: service_healthy }
      postgres: { condition: service_healthy }
      clickhouse: { condition: service_healthy }
    environment:
      <<: *env
      CLICKHOUSE_ADDR: clickhouse:9000
      CLICKHOUSE_USER: resolvex_ro
      CLICKHOUSE_PASSWORD: resolvex_ro
      # Optional server-wide fallback when an organization has not configured its
      # own provider in Settings. Evidence is then sent to that provider.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      AI_PROVIDER: ${AI_PROVIDER:-}
      AI_MODEL: ${AI_MODEL:-}
      AI_ALLOW_PRIVATE_BASE_URLS: "true"   # local dev: lets you point at Ollama on the host

  assistant:
    <<: *go
    build: { context: .., args: { SERVICE: assistant } }
    expose: ["8083"]
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      <<: *env
      QUERY_URL: http://query:8081
      INCIDENT_URL: http://incident:8082
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      AI_PROVIDER: ${AI_PROVIDER:-}
      AI_MODEL: ${AI_MODEL:-}
      AI_ALLOW_PRIVATE_BASE_URLS: "true"   # local dev only; leave unset in production (SSRF guard)

  kong:
    image: kong:3.9             # open-source Kong Gateway, DB-less
    depends_on: [tenancy, query, incident, assistant]
    ports:
      - "8000:8000"             # proxy (the public API)
      - "127.0.0.1:8001:8001"   # admin API, localhost only
      - "8100:8100"             # status / metrics
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /kong/kong.yml
      KONG_PROXY_LISTEN: 0.0.0.0:8000
      KONG_ADMIN_LISTEN: 0.0.0.0:8001
      KONG_STATUS_LISTEN: 0.0.0.0:8100
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_ADMIN_ERROR_LOG: /dev/stderr
    volumes: ["./kong/kong.yml:/kong/kong.yml:ro"]
    healthcheck: { test: ["CMD", "kong", "health"], interval: 5s, retries: 20 }
